<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeMashup.com - Experimental Prompt Builder</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-deep:#0d0d0f;--bg-panel:#16161a;--bg-card:#1e1e24;--bg-card-hover:#25252d;--bg-input:#111114;--border:#2a2a33;--border-active:#4a4a5a;--text-primary:#e8e6e3;--text-secondary:#8a8a96;--text-dim:#55555f;--accent-pos:#4fc1a6;--accent-pos-dim:#4fc1a620;--accent-neg:#e06c75;--accent-neg-dim:#e06c7520;--accent-blue:#61afef;--accent-blue-dim:#61afef20;--accent-yellow:#e5c07b;--accent-yellow-dim:#e5c07b20;--accent-purple:#c678dd;--accent-purple-dim:#c678dd20;--accent-orange:#d19a66;--accent-orange-dim:#d19a6620;--accent-cyan:#56b6c2;--accent-cyan-dim:#56b6c220;--accent-pink:#e06ca0;--accent-pink-dim:#e06ca020;--tag-quality:#c678dd;--tag-source:#61afef;--tag-rating:#e5c07b;--tag-subject:#4fc1a6;--tag-style:#d19a66;--tag-negative:#e06c75;--tag-camera:#56b6c2;--tag-nsfw:#e06ca0;--accent-rand:#f0c040;--accent-rand-dim:#f0c04025;--radius-sm:4px;--radius-md:8px;--radius-lg:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-deep);color:var(--text-primary);font-family:'Space Grotesk',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.06;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.header h1{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;letter-spacing:-.5px}
.header h1 span{color:var(--accent-purple)}
.header-actions{display:flex;gap:6px}
.btn{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-secondary);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg-card-hover);color:var(--text-primary);border-color:var(--border-active)}
.btn-accent{background:var(--accent-pos-dim);border-color:var(--accent-pos);color:var(--accent-pos)}
.btn-accent:hover{background:var(--accent-pos);color:var(--bg-deep)}
.btn-danger{background:var(--accent-neg-dim);border-color:var(--accent-neg);color:var(--accent-neg)}
.btn-danger:hover{background:var(--accent-neg);color:var(--bg-deep)}
.btn-rand{background:var(--accent-rand-dim);border-color:var(--accent-rand);color:var(--accent-rand)}
.btn-rand:hover{background:var(--accent-rand);color:var(--bg-deep)}
.btn-small{padding:3px 7px;font-size:9px}
.templates-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding:12px 14px;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg)}
.templates-bar .label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);display:flex;align-items:center;margin-right:6px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tag-panel{display:flex;flex-direction:column;gap:10px}
.tag-section{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.tag-section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;transition:background .15s}
.tag-section-header:hover{background:var(--bg-card)}
.tag-section-title{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.tag-section-title .dot{width:7px;height:7px;border-radius:50%}
.tag-section-chevron{font-size:10px;color:var(--text-dim);transition:transform .2s}
.tag-section.collapsed .tag-section-chevron{transform:rotate(-90deg)}
.tag-section.collapsed .tag-section-body{display:none}
.tag-section-body{padding:10px 14px}
.tag-group{margin-bottom:10px}.tag-group:last-child{margin-bottom:0}
.tag-group-label{font-size:9px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.tag-group-label.nsfw-label{color:var(--tag-nsfw)}
.tag-grid{display:flex;flex-wrap:wrap;gap:4px}
.nsfw-divider{border-top:1px dashed var(--tag-nsfw);margin:10px 0 6px;opacity:.3}
.tag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:4px 8px;border-radius:var(--radius-sm);cursor:pointer;transition:all .12s;border:1px solid transparent;user-select:none}
.tag:active{transform:scale(.95)}
.tag[data-cat="quality"]{background:var(--accent-purple-dim);color:var(--tag-quality)}.tag[data-cat="quality"]:hover{border-color:var(--tag-quality)}
.tag[data-cat="source"]{background:var(--accent-blue-dim);color:var(--tag-source)}.tag[data-cat="source"]:hover{border-color:var(--tag-source)}
.tag[data-cat="rating"]{background:var(--accent-yellow-dim);color:var(--tag-rating)}.tag[data-cat="rating"]:hover{border-color:var(--tag-rating)}
.tag[data-cat="subject"]{background:var(--accent-pos-dim);color:var(--tag-subject)}.tag[data-cat="subject"]:hover{border-color:var(--tag-subject)}
.tag[data-cat="style"]{background:var(--accent-orange-dim);color:var(--tag-style)}.tag[data-cat="style"]:hover{border-color:var(--tag-style)}
.tag[data-cat="camera"]{background:var(--accent-cyan-dim);color:var(--tag-camera)}.tag[data-cat="camera"]:hover{border-color:var(--tag-camera)}
.tag[data-cat="negative"]{background:var(--accent-neg-dim);color:var(--tag-negative)}.tag[data-cat="negative"]:hover{border-color:var(--tag-negative)}
.tag[data-cat="nsfw"]{background:var(--accent-pink-dim);color:var(--tag-nsfw)}.tag[data-cat="nsfw"]:hover{border-color:var(--tag-nsfw)}
.tag.in-positive{outline:2px solid var(--accent-pos);outline-offset:-1px;opacity:.45}
.tag.in-negative{outline:2px solid var(--accent-neg);outline-offset:-1px;opacity:.45}
.tag.in-random{outline:2px dashed var(--accent-rand);outline-offset:-1px;animation:randPulse 1.5s infinite}
@keyframes randPulse{0%,100%{opacity:1}50%{opacity:.6}}
.tag-hint{font-size:9px;color:var(--text-dim);margin-top:5px;font-style:italic}
.prompt-panel{display:flex;flex-direction:column;gap:12px;position:sticky;top:20px;align-self:start}
.prompt-box{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.prompt-box-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)}
.prompt-box-title{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.prompt-box-title .indicator{width:7px;height:7px;border-radius:50%}
.prompt-box.positive .indicator{background:var(--accent-pos)}
.prompt-box.negative .indicator{background:var(--accent-neg)}
.prompt-box-actions{display:flex;gap:4px}
.prompt-tags{padding:10px 14px;min-height:60px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.prompt-tags:empty::before{content:attr(data-placeholder);color:var(--text-dim);font-size:11px;font-style:italic}
.prompt-tag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 6px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:4px;animation:tagIn .12s ease}
@keyframes tagIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.prompt-tag[data-cat="quality"]{background:var(--accent-purple-dim);color:var(--tag-quality)}
.prompt-tag[data-cat="source"]{background:var(--accent-blue-dim);color:var(--tag-source)}
.prompt-tag[data-cat="rating"]{background:var(--accent-yellow-dim);color:var(--tag-rating)}
.prompt-tag[data-cat="subject"]{background:var(--accent-pos-dim);color:var(--tag-subject)}
.prompt-tag[data-cat="style"]{background:var(--accent-orange-dim);color:var(--tag-style)}
.prompt-tag[data-cat="camera"]{background:var(--accent-cyan-dim);color:var(--tag-camera)}
.prompt-tag[data-cat="negative"]{background:var(--accent-neg-dim);color:var(--tag-negative)}
.prompt-tag[data-cat="nsfw"]{background:var(--accent-pink-dim);color:var(--tag-nsfw)}
.prompt-tag[data-cat="custom"]{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border)}
.prompt-tag .weight{font-size:8px;color:var(--text-dim)}
.prompt-tag .wb{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:11px;font-family:'JetBrains Mono',monospace;padding:0 1px;line-height:1}
.prompt-tag .wb:hover{color:var(--text-primary)}
.prompt-tag .rm{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;line-height:1;padding:0 1px}
.prompt-tag .rm:hover{color:var(--accent-neg)}
.prompt-output{padding:10px 14px;border-top:1px solid var(--border)}
.prompt-text{font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.6;color:var(--text-secondary);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;width:100%;min-height:50px;resize:vertical;outline:none}
.prompt-text:focus{border-color:var(--border-active)}
.cir{display:flex;gap:4px;padding:0 14px 10px}
.ci{font-family:'JetBrains Mono',monospace;font-size:10px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-primary);flex:1;outline:none}
.ci:focus{border-color:var(--border-active)}.ci::placeholder{color:var(--text-dim)}
.section-ci{display:flex;gap:4px;padding:0 0 8px}
.rand-box{background:var(--bg-panel);border:1px solid var(--accent-rand);border-radius:var(--radius-lg);padding:12px 14px}
.rand-box h3{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--accent-rand);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.rand-pool{margin-bottom:8px}
.rand-pool-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim);margin-bottom:4px}
.rand-pool-tags{display:flex;flex-wrap:wrap;gap:3px}
.rand-pool-tag{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;border-radius:var(--radius-sm);background:var(--accent-rand-dim);color:var(--accent-rand);border:1px dashed var(--accent-rand);cursor:pointer}
.rand-pool-tag:hover{opacity:.7}
.rand-pool-tag.picked{background:var(--accent-rand);color:var(--bg-deep);border-style:solid;font-weight:600}
.saved-prompts{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px}
.saved-prompts h3{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-secondary);margin-bottom:8px}
.saved-list{display:flex;flex-direction:column;gap:4px}
.saved-item{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:10px}
.saved-item-name{font-family:'JetBrains Mono',monospace;color:var(--text-primary);cursor:pointer}
.saved-item-name:hover{color:var(--accent-blue)}
.saved-item-actions{display:flex;gap:3px}
.toast{position:fixed;bottom:20px;right:20px;padding:8px 16px;background:var(--accent-pos);color:var(--bg-deep);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;border-radius:var(--radius-md);opacity:0;transform:translateY(10px);transition:all .3s ease;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:960px){.layout{grid-template-columns:1fr}.prompt-panel{position:static}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1><span>⬡</span> AnimeMashup.com - Experimental Prompt Builder <span>V1</span></h1>
    <div class="header-actions">
      <a href="https://animemashup.com/">Return to Home</a>
      <button class="btn btn-rand" onclick="rollRandom()">🎲 Randomize</button>
      <button class="btn" onclick="clearAll()">Clear All</button>
      <button class="btn" onclick="resetDefaults()">Reset Defaults</button>
      <button class="btn" onclick="savePrompt()">Save Preset</button>
    </div>
  </div>
  <div class="templates-bar">
    <span class="label">Templates:</span>
    <button class="btn btn-small" onclick="loadTemplate('anime')">Anime</button>
    <button class="btn btn-small" onclick="loadTemplate('cartoon')">Cartoon</button>
    <button class="btn btn-small" onclick="loadTemplate('realistic')">Realistic</button>
    <button class="btn btn-small" onclick="loadTemplate('portrait')">Portrait</button>
    <button class="btn btn-small" onclick="loadTemplate('outdoor')">Outdoor</button>
    <button class="btn btn-small" onclick="loadTemplate('minimal')">Minimal</button>
    <button class="btn btn-small" onclick="loadTemplate('fullQuality')">Quality Only</button>
  </div>
  <div class="layout">
    <div class="tag-panel" id="tag-panel"></div>
    <div class="prompt-panel">
      <div class="prompt-box positive">
        <div class="prompt-box-header">
          <span class="prompt-box-title"><span class="indicator"></span> Positive Prompt</span>
          <div class="prompt-box-actions">
            <button class="btn btn-small btn-accent" onclick="copyPrompt('pos')">Copy All</button>
            <button class="btn btn-small btn-danger" onclick="clearPrompt('pos')">Clear</button>
          </div>
        </div>
        <div class="prompt-tags" id="pos-tags" data-placeholder="Click tags — Shift+click to add to random pool..."></div>
        <div class="cir"><input class="ci" id="pos-custom" placeholder="Custom tag (comma-separated)..." onkeydown="if(event.key==='Enter')addCustomTag('pos')"><button class="btn btn-small" onclick="addCustomTag('pos')">Add</button></div>
        <div class="prompt-output"><textarea class="prompt-text" id="pos-output" readonly></textarea></div>
      </div>
      <div class="prompt-box negative">
        <div class="prompt-box-header">
          <span class="prompt-box-title"><span class="indicator"></span> Negative Prompt</span>
          <div class="prompt-box-actions">
            <button class="btn btn-small btn-accent" onclick="copyPrompt('neg')">Copy All</button>
            <button class="btn btn-small btn-danger" onclick="clearPrompt('neg')">Clear</button>
          </div>
        </div>
        <div class="prompt-tags" id="neg-tags" data-placeholder="Right-click any tag or click negatives..."></div>
        <div class="cir"><input class="ci" id="neg-custom" placeholder="Custom negative tag..." onkeydown="if(event.key==='Enter')addCustomTag('neg')"><button class="btn btn-small" onclick="addCustomTag('neg')">Add</button></div>
        <div class="prompt-output"><textarea class="prompt-text" id="neg-output" readonly></textarea></div>
      </div>
      <div class="rand-box" id="rand-box">
        <h3>🎲 Random Pools <button class="btn btn-small btn-danger" onclick="clearRandomPools()" style="margin-left:auto">Clear Pools</button></h3>
        <div id="rand-pools"><div style="color:var(--text-dim);font-size:10px;font-style:italic;">Shift+click tags to add them to random pools. Hit 🎲 Randomize to pick one from each group.</div></div>
      </div>
      <div class="saved-prompts"><h3>Saved Presets</h3><div class="saved-list" id="saved-list"><div style="color:var(--text-dim);font-size:10px;font-style:italic;">No saved presets</div></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SO=['quality','source','rating','subject','hair','eyes','clothing','pose','camera','scene','style','negative','nsfw','custom'];

const TS=[
{id:'quality',label:'Quality Tags',color:'var(--tag-quality)',groups:[
{label:'Positive quality (always first)',tags:['score_9','score_8_up','score_7_up','score_6_up','score_5_up','score_4_up']},
{label:'Negative quality',cat:'negative',tags:['score_6','score_5','score_4']}
],hint:'Click = positive + copy · Right-click = negative · Shift+click = random pool'},

{id:'source',label:'Source Tags',color:'var(--tag-source)',groups:[
{label:'Style filter',tags:['source_anime','source_cartoon','source_furry','source_pony','source_rule34']}
],hint:'Put source_pony / source_furry in negative to avoid unwanted styles'},

{id:'rating',label:'Rating',color:'var(--tag-rating)',groups:[
{label:'Content rating',tags:['rating_safe','rating_questionable','rating_explicit']}
]},

{id:'subject',label:'Character / Body',color:'var(--tag-subject)',groups:[
{label:'Count',tags:['1girl','2girls','multiple_girls','1boy','2boys','multiple_boys','solo','couple','group']},
{label:'Race / Ethnicity / Skin',tags:['pale_skin','light_skin','fair_skin','tan_skin','dark_skin','brown_skin','black_skin','olive_skin','asian','japanese','chinese','korean','european','caucasian','african','dark-skinned_female','dark-skinned_male','latina','hispanic','middle_eastern','indian','south_asian','southeast_asian','mixed_race']},
{label:'Age / Type',tags:['mature','adult','woman','man','milf','20yo','25yo','30yo','40yo','elderly']},
{label:'Body type',tags:['slim','slender','fit','athletic','toned','muscular','curvy','petite','tall','short','thicc','plump','hourglass','voluptuous','plus-sized','skinny']},
{label:'Breasts',tags:['flat_chest','small_breasts','medium_breasts','large_breasts','huge_breasts']},
{label:'Body details',tags:['abs','toned_stomach','wide_hips','narrow_waist','thick_thighs','long_legs','bubble_butt','large_ass','slim_waist','collarbone','neck','shoulders']},
{label:'Skin marks',tags:['freckles','mole','beauty_mark','scar','birthmark','dimples']},
{label:'Body art',tags:['tattoo','arm_tattoo','back_tattoo','shoulder_tattoo','chest_tattoo','leg_tattoo','neck_tattoo','sleeve_tattoo','tribal_tattoo','flower_tattoo','dragon_tattoo','small_tattoo','full_body_tattoo','temporary_tattoo','henna','body_paint','body_writing']},
{label:'Piercings',tags:['piercing','ear_piercing','nose_piercing','nose_ring','nose_stud','septum_piercing','lip_piercing','lip_ring','tongue_piercing','eyebrow_piercing','navel_piercing','belly_button_piercing','nipple_piercing','industrial_piercing','multiple_piercings','dermal_piercing','stud','barbell_piercing','gauge_earrings']},
{nsfw:true,label:'NSFW — Body',cat:'nsfw',tags:['nude','topless','bottomless','completely_nude','naked','undressing','nipples','areolae','pussy','penis','anus','ass','thighs','exposed','naked_apron','naked_towel','covered_nipples','convenient_censoring','strategically_covered']}
]},

{id:'hair',label:'Hair',color:'var(--tag-subject)',groups:[
{label:'Length',tags:['very_long_hair','long_hair','medium_hair','short_hair','bob_cut','pixie_cut','buzz_cut','shoulder-length_hair']},
{label:'Color',tags:['blonde_hair','platinum_blonde','golden_blonde','dirty_blonde','strawberry_blonde','brown_hair','light_brown_hair','dark_brown_hair','brunette','black_hair','red_hair','auburn_hair','ginger','white_hair','silver_hair','grey_hair','blue_hair','pink_hair','purple_hair','green_hair','orange_hair','multicolored_hair','gradient_hair','streaked_hair','two-tone_hair','dyed_hair','highlights','ombre_hair','roots_showing']},
{label:'Style',tags:['straight_hair','wavy_hair','curly_hair','messy_hair','spiky_hair','slicked_back','windswept_hair','wet_hair','ponytail','high_ponytail','low_ponytail','side_ponytail','twintails','pigtails','braid','braids','french_braid','side_braid','fishtail_braid','bun','hair_bun','double_bun','messy_bun','top_knot','updo','half_updo','hair_down','loose_hair','afro','dreadlocks','cornrows']},
{label:'Bangs',tags:['bangs','side_bangs','blunt_bangs','swept_bangs','parted_bangs','curtain_bangs','hair_over_one_eye','hair_between_eyes','forehead']},
{label:'Hair accessories',tags:['hair_ornament','hair_ribbon','hairclip','hairpin','hair_tie','headband','hair_flower','tiara','bow_in_hair','scrunchie']}
]},
{id:'eyes',label:'Eyes, Face & Makeup',color:'var(--tag-subject)',groups:[
{label:'Eye color',tags:['blue_eyes','green_eyes','brown_eyes','grey_eyes','hazel_eyes','red_eyes','purple_eyes','golden_eyes','amber_eyes','heterochromia','dark_eyes','light_eyes']},
{label:'Eye detail',tags:['detailed_eyes','bright_eyes','sparkling_eyes','glowing_eyes','half-closed_eyes','narrow_eyes','wide_eyes','eyes_closed','sleepy_eyes','bedroom_eyes','piercing_eyes','eye_contact','bloodshot_eyes','teary_eyes','puffy_eyes','bags_under_eyes','long_eyelashes','thick_eyelashes','false_eyelashes']},
{label:'Eyebrows',tags:['thin_eyebrows','thick_eyebrows','arched_eyebrows','straight_eyebrows','bushy_eyebrows','groomed_eyebrows','raised_eyebrow','furrowed_brow']},
{label:'Nose',tags:['small_nose','button_nose','pointed_nose','upturned_nose','aquiline_nose','broad_nose','narrow_nose','freckled_nose','runny_nose','red_nose']},
{label:'Lips & Mouth',tags:['thin_lips','full_lips','plump_lips','pouty_lips','cupids_bow','heart-shaped_lips','parted_lips','closed_lips','lip_bite','lip_gloss','chapped_lips']},

const DP=[{tag:'score_9',cat:'quality',w:1},{tag:'score_8_up',cat:'quality',w:1},{tag:'score_7_up',cat:'quality',w:1},{tag:'score_6_up',cat:'quality',w:1},{tag:'score_5_up',cat:'quality',w:1},{tag:'score_4_up',cat:'quality',w:1}];
const DN=[{tag:'score_6',cat:'negative',w:1},{tag:'score_5',cat:'negative',w:1},{tag:'score_4',cat:'negative',w:1},{tag:'worst_quality',cat:'negative',w:1.2},{tag:'low_quality',cat:'negative',w:1.2},{tag:'normal_quality',cat:'negative',w:1.2},{tag:'lowres',cat:'negative',w:1},{tag:'bad_anatomy',cat:'negative',w:1},{tag:'bad_hands',cat:'negative',w:1},{tag:'signature',cat:'negative',w:1},{tag:'watermark',cat:'negative',w:1},{tag:'ugly',cat:'negative',w:1},{tag:'imperfect_eyes',cat:'negative',w:1},{tag:'skewed_eyes',cat:'negative',w:1},{tag:'unnatural_face',cat:'negative',w:1},{tag:'unnatural_body',cat:'negative',w:1},{tag:'error',cat:'negative',w:1},{tag:'extra_limb',cat:'negative',w:1},{tag:'missing_limbs',cat:'negative',w:1}];

const state={pos:JSON.parse(JSON.stringify(DP)),neg:JSON.parse(JSON.stringify(DN))};

// RANDOM POOLS: { "groupLabel": [{tag, cat}, ...] }
const randomPools={};
// Track which tag was last picked per pool
const randomPicks={};

// Map each tag to its section id and group label
const tagSectionMap={};
const tagGroupMap={};
TS.forEach(s=>{s.groups.forEach(g=>{g.tags.forEach(t=>{
  tagSectionMap[t]=g.cat||s.id;
  tagGroupMap[t]=g.label;
})})});

function getSectionIndex(cat){const i=SO.indexOf(cat);return i===-1?SO.length:i}

function insertOrdered(list,item){
  const idx=getSectionIndex(item.cat);
  let insertAt=list.length;
  for(let i=list.length-1;i>=0;i--){
    if(getSectionIndex(list[i].cat)<=idx){insertAt=i+1;break}
    if(i===0)insertAt=0;
  }
  list.splice(insertAt,0,item);
}

// BUILD PANEL
function buildTagPanel(){
  const panel=document.getElementById('tag-panel');
  panel.innerHTML=TS.map(section=>{
    const cc=section.collapsed?' collapsed':'';
    const groups=section.groups.map(group=>{
      const cat=group.cat||(section.id==='negatives'?'negative':section.id);
      const isNsfw=group.nsfw;
      const divider=isNsfw?'<div class="nsfw-divider"></div>':'';
      const labelClass=isNsfw?'tag-group-label nsfw-label':'tag-group-label';
      const tags=group.tags.map(tag=>{
        const dc=cat==='nsfw'?'nsfw':cat;
        return `<span class="tag" data-cat="${dc}" data-tag="${tag}" data-group="${group.label}" data-section="${group.cat||section.id}" onclick="clickTag(this,event)" oncontextmenu="rightClickTag(this,event)">${tag}</span>`;
      }).join('');
      return `${divider}<div class="tag-group"><div class="${labelClass}">${group.label}</div><div class="tag-grid">${tags}</div></div>`;
    }).join('');
    const hint=section.hint?`<div class="tag-hint">${section.hint}</div>`:'';
    const neg=section.id==='negatives';
    const freeInput=`<div class="section-ci"><input class="ci" placeholder="Add custom ${section.label.toLowerCase()}..." onkeydown="if(event.key==='Enter')addSectionCustom(this,'${neg?'neg':'pos'}','${section.id}')"><button class="btn btn-small" onclick="addSectionCustom(this.previousElementSibling,'pos','${section.id}')">+Pos</button>${neg?'':`<button class="btn btn-small" onclick="addSectionCustom(this.previousElementSibling.previousElementSibling,'neg','${section.id}')" style="margin-left:2px">+Neg</button>`}</div>`;
    return `<div class="tag-section${cc}" data-section="${section.id}"><div class="tag-section-header" onclick="toggleSection(this)"><span class="tag-section-title"><span class="dot" style="background:${section.color}"></span> ${section.label}</span><span class="tag-section-chevron">▼</span></div><div class="tag-section-body">${freeInput}${groups}${hint}</div></div>`;
  }).join('');
}

// CLICK HANDLERS
function clickTag(el,ev){
  ev.preventDefault();
  const tag=el.dataset.tag;
  const cat=el.dataset.cat;
  const group=el.dataset.group;

  // SHIFT+CLICK = add to random pool
  if(ev.shiftKey){
    addToRandomPool(tag,cat,group);
    return;
  }

  // Always copy to clipboard
  navigator.clipboard.writeText(tag).catch(()=>{});
  // Toggle in positive
  const inPos=state.pos.find(t=>t.tag===tag);
  const inNeg=state.neg.find(t=>t.tag===tag);
  if(inPos){removeFromList('pos',tag);showToast(`Removed: ${tag}`);return}
  if(inNeg)removeFromList('neg',tag);
  const resolvedCat=tagSectionMap[tag]||cat;
  insertOrdered(state.pos,{tag,cat:resolvedCat,w:1.0});
  render();
  showToast(`✓ ${tag} → copied`);
}

function rightClickTag(el,ev){
  ev.preventDefault();
  const tag=el.dataset.tag;
  const cat=el.dataset.cat;
  navigator.clipboard.writeText(tag).catch(()=>{});
  const inNeg=state.neg.find(t=>t.tag===tag);
  const inPos=state.pos.find(t=>t.tag===tag);
  if(inNeg){removeFromList('neg',tag);showToast(`Removed: ${tag}`);return}
  if(inPos)removeFromList('pos',tag);
  const resolvedCat=tagSectionMap[tag]||cat;
  insertOrdered(state.neg,{tag,cat:resolvedCat,w:1.0});
  render();
  showToast(`✓ ${tag} → negative + copied`);
}

// RANDOM POOL FUNCTIONS
function addToRandomPool(tag,cat,group){
  if(!randomPools[group])randomPools[group]=[];
  const exists=randomPools[group].find(x=>x.tag===tag);
  if(exists){
    // Remove from pool
    randomPools[group]=randomPools[group].filter(x=>x.tag!==tag);
    if(!randomPools[group].length)delete randomPools[group];
    showToast(`Removed ${tag} from pool`);
  } else {
    const resolvedCat=tagSectionMap[tag]||cat;
    randomPools[group].push({tag,cat:resolvedCat});
    showToast(`🎲 ${tag} → "${group}" pool`);
  }
  render();
  renderRandomPools();
}

function removeFromRandomPool(tag,group){
  if(!randomPools[group])return;
  randomPools[group]=randomPools[group].filter(x=>x.tag!==tag);
  if(!randomPools[group].length)delete randomPools[group];
  render();
  renderRandomPools();
}

function clearRandomPools(){
  Object.keys(randomPools).forEach(k=>delete randomPools[k]);
  Object.keys(randomPicks).forEach(k=>delete randomPicks[k]);
  render();
  renderRandomPools();
  showToast('Random pools cleared');
}

function rollRandom(){
  const groups=Object.keys(randomPools);
  if(!groups.length){showToast('No random pools! Shift+click tags first.');return}

  groups.forEach(group=>{
    const pool=randomPools[group];
    if(!pool||!pool.length)return;

    // Remove previous pick from this pool if it's in positive
    if(randomPicks[group]){
      state.pos=state.pos.filter(x=>x.tag!==randomPicks[group]);
    }

    // Pick random
    const pick=pool[Math.floor(Math.random()*pool.length)];
    randomPicks[group]=pick.tag;

    // Add to positive if not already there
    if(!state.pos.find(x=>x.tag===pick.tag)){
      insertOrdered(state.pos,{tag:pick.tag,cat:pick.cat,w:1.0});
    }
  });

  render();
  renderRandomPools();
  showToast('🎲 Randomized!');
}

function renderRandomPools(){
  const container=document.getElementById('rand-pools');
  const groups=Object.keys(randomPools);
  if(!groups.length){
    container.innerHTML='<div style="color:var(--text-dim);font-size:10px;font-style:italic;">Shift+click tags to add them to random pools. Hit 🎲 Randomize to pick one from each group.</div>';
    return;
  }
  container.innerHTML=groups.map(group=>{
    const pool=randomPools[group];
    const tags=pool.map(x=>{
      const isPicked=randomPicks[group]===x.tag;
      return `<span class="rand-pool-tag${isPicked?' picked':''}" onclick="removeFromRandomPool('${x.tag}','${group}')">${x.tag}${isPicked?' ✓':''}</span>`;
    }).join('');
    return `<div class="rand-pool"><div class="rand-pool-label">${group} (${pool.length})</div><div class="rand-pool-tags">${tags}</div></div>`;
  }).join('');
}

function removeFromList(t,tag){state[t]=state[t].filter(x=>x.tag!==tag);render()}

function addSectionCustom(input,target,sectionId){
  const val=input.value.trim();if(!val)return;
  val.split(',').map(x=>x.trim()).filter(x=>x).forEach(tag=>{
    if(!state[target].find(x=>x.tag===tag)){
      const cat=sectionId==='negatives'?'negative':sectionId;
      insertOrdered(state[target],{tag,cat,w:1.0});
    }
  });
  input.value='';render();
}

function addCustomTag(t){
  const input=document.getElementById(t+'-custom');
  const val=input.value.trim();if(!val)return;
  val.split(',').map(x=>x.trim()).filter(x=>x).forEach(tag=>{
    if(!state[t].find(x=>x.tag===tag))insertOrdered(state[t],{tag,cat:'custom',w:1.0});
  });
  input.value='';render();
}

function adjustWeight(t,i,d){state[t][i].w=Math.max(0.1,Math.min(2.0,Math.round((state[t][i].w+d)*10)/10));render()}
function removeTag(t,i){state[t].splice(i,1);render()}
function clearPrompt(t){state[t]=[];render()}
function clearAll(){state.pos=[];state.neg=[];render()}
function resetDefaults(){state.pos=JSON.parse(JSON.stringify(DP));state.neg=JSON.parse(JSON.stringify(DN));render();showToast('Reset to defaults')}

// BUILD OUTPUT with BREAKs between sections
function buildPromptString(t){
  const items=state[t];if(!items.length)return'';
  let sections={};
  items.forEach(x=>{const key=x.cat;if(!sections[key])sections[key]=[];sections[key].push(x)});
  let parts=[];
  SO.forEach(key=>{
    if(!sections[key])return;
    const chunk=sections[key].map(x=>{
      if(x.w!==1.0)return`(${x.tag}:${x.w})`;
      return x.tag;
    }).join(', ');
    if(chunk)parts.push(chunk);
  });
  return parts.join(', ');
}

function render(){
  ['pos','neg'].forEach(t=>{
    const c=document.getElementById(t+'-tags');c.innerHTML='';
    state[t].forEach((item,i)=>{
      const el=document.createElement('span');el.className='prompt-tag';el.dataset.cat=item.cat;
      const l=document.createElement('span');l.textContent=item.tag;el.appendChild(l);
      if(item.w!==1.0){const w=document.createElement('span');w.className='weight';w.textContent=`:${item.w}`;el.appendChild(w)}
      const m=document.createElement('button');m.className='wb';m.textContent='−';m.onclick=()=>adjustWeight(t,i,-0.1);el.appendChild(m);
      const p=document.createElement('button');p.className='wb';p.textContent='+';p.onclick=()=>adjustWeight(t,i,0.1);el.appendChild(p);
      const rm=document.createElement('button');rm.className='rm';rm.textContent='×';rm.onclick=()=>removeTag(t,i);el.appendChild(rm);
      c.appendChild(el);
    });
    document.getElementById(t+'-output').value=buildPromptString(t);
  });
  // Update tag visual states
  const allRandTags=new Set();
  Object.values(randomPools).forEach(pool=>pool.forEach(x=>allRandTags.add(x.tag)));
  document.querySelectorAll('.tag-panel .tag').forEach(el=>{
    const tag=el.dataset.tag;
    el.classList.remove('in-positive','in-negative','in-random');
    if(state.pos.find(t=>t.tag===tag))el.classList.add('in-positive');
    if(state.neg.find(t=>t.tag===tag))el.classList.add('in-negative');
    if(allRandTags.has(tag))el.classList.add('in-random');
  });
}

function copyPrompt(t){
  const text=buildPromptString(t);if(!text){showToast('Nothing to copy!');return}
  navigator.clipboard.writeText(text).then(()=>showToast(t==='pos'?'Positive copied!':'Negative copied!'));
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),1500)}
function toggleSection(h){h.parentElement.classList.toggle('collapsed')}

// TEMPLATES
const templates={
  anime:{pos:[...DP,{tag:'source_anime',cat:'source',w:1},{tag:'rating_safe',cat:'rating',w:1},{tag:'1girl',cat:'subject',w:1}],neg:[...DN,{tag:'source_pony',cat:'negative',w:1},{tag:'source_furry',cat:'negative',w:1}]},
  cartoon:{pos:[...DP,{tag:'source_cartoon',cat:'source',w:1},{tag:'rating_safe',cat:'rating',w:1}],neg:[...DN]},
  realistic:{pos:[...DP,{tag:'1girl',cat:'subject',w:1},{tag:'photorealistic',cat:'style',w:1.3},{tag:'detailed_face',cat:'style',w:1},{tag:'detailed_skin',cat:'style',w:1},{tag:'natural_lighting',cat:'style',w:1}],neg:[...DN,{tag:'3d',cat:'negative',w:1},{tag:'cartoon',cat:'negative',w:1},{tag:'anime',cat:'negative',w:1}]},
  portrait:{pos:[...DP,{tag:'1girl',cat:'subject',w:1},{tag:'portrait',cat:'camera',w:1},{tag:'detailed_face',cat:'eyes',w:1},{tag:'detailed_eyes',cat:'eyes',w:1},{tag:'looking_at_viewer',cat:'pose',w:1},{tag:'natural_lighting',cat:'style',w:1},{tag:'depth_of_field',cat:'camera',w:1},{tag:'photorealistic',cat:'style',w:1.3}],neg:[...DN]},
  outdoor:{pos:[...DP,{tag:'1girl',cat:'subject',w:1},{tag:'outdoors',cat:'scene',w:1},{tag:'sunset',cat:'scene',w:1},{tag:'golden_hour',cat:'scene',w:1},{tag:'bokeh',cat:'camera',w:1},{tag:'photorealistic',cat:'style',w:1.3},{tag:'soft_lighting',cat:'style',w:1}],neg:[...DN]},
  minimal:{pos:[{tag:'score_9',cat:'quality',w:1},{tag:'score_8_up',cat:'quality',w:1},{tag:'score_7_up',cat:'quality',w:1}],neg:[]},
  fullQuality:{pos:[...DP],neg:[...DN]},
};
function loadTemplate(n){state.pos=JSON.parse(JSON.stringify(templates[n].pos));state.neg=JSON.parse(JSON.stringify(templates[n].neg));render();showToast(`Template "${n}" loaded`)}

// SAVE/LOAD
function getSaved(){try{return JSON.parse(localStorage.getItem('ponyPresets')||'[]')}catch{return[]}}
function savePrompt(){const name=prompt('Preset name:');if(!name)return;const saved=getSaved();saved.push({name,pos:state.pos,neg:state.neg,pools:JSON.parse(JSON.stringify(randomPools)),date:Date.now()});localStorage.setItem('ponyPresets',JSON.stringify(saved));renderSaved();showToast(`"${name}" saved!`)}
function loadSaved(i){const s=getSaved();state.pos=JSON.parse(JSON.stringify(s[i].pos));state.neg=JSON.parse(JSON.stringify(s[i].neg));if(s[i].pools){Object.keys(randomPools).forEach(k=>delete randomPools[k]);Object.assign(randomPools,JSON.parse(JSON.stringify(s[i].pools)))}render();renderRandomPools();showToast(`"${s[i].name}" loaded`)}
function deleteSaved(i){const s=getSaved();const n=s[i].name;s.splice(i,1);localStorage.setItem('ponyPresets',JSON.stringify(s));renderSaved();showToast(`"${n}" deleted`)}
function renderSaved(){const list=document.getElementById('saved-list');const saved=getSaved();if(!saved.length){list.innerHTML='<div style="color:var(--text-dim);font-size:10px;font-style:italic;">No saved presets</div>';return}list.innerHTML=saved.map((s,i)=>`<div class="saved-item"><span class="saved-item-name" onclick="loadSaved(${i})">${s.name}</span><div class="saved-item-actions"><button class="btn btn-small" onclick="loadSaved(${i})">Load</button><button class="btn btn-small btn-danger" onclick="deleteSaved(${i})">×</button></div></div>`).join('')}

buildTagPanel();render();renderSaved();renderRandomPools();
</script>
